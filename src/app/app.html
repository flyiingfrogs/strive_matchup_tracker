@if (playerId) {

  <div class="player-btn-bar">
    <button class="player-btn" (click)="resetPlayer()">Change Player</button>
  </div>
  <div class="app-container">
    <app-character-sidebar></app-character-sidebar>
    <router-outlet></router-outlet>
  </div>
} @else {

  <app-player-setup (playerSelected)="onPlayerSelected($event)"></app-player-setup>
}
