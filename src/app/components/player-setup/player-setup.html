

<h1>Find your player</h1>
<input type="text" [(ngModel)]="searchQuery" placeholder="Enter your Steam username" />
<button class="player-btn" (click)="onSearch()">Search</button>

@for (result of searchResults$ | async; track result.id) {
    <div class="player-name" (click)="selectPlayer(result)">{{result.name}}</div>
}
